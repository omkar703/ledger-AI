<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="ledgerBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="aiGlow" x1="34" y1="34" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="aiShadow" x="30" y="30" width="26" height="26" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Base with smooth rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#ledgerBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Ledger Grid / Balance Blocks -->
  <!-- Top Left: Primary Verified Ledger Block -->
  <rect x="12" y="12" width="17" height="17" rx="4.5" fill="#F8FAFC"/>
  <!-- Decorative accounting ledger rule lines inside top-left -->
  <rect x="15.5" y="17" width="10" height="2" rx="1" fill="#0F172A"/>
  <rect x="15.5" y="21.5" width="6.5" height="2" rx="1" fill="#64748B"/>

  <!-- Top Right: Ledger Entry Column -->
  <rect x="35" y="12" width="17" height="17" rx="4.5" fill="#334155" fill-opacity="0.75"/>
  <rect x="38.5" y="17" width="10" height="2" rx="1" fill="#94A3B8"/>
  <rect x="38.5" y="21.5" width="7" height="2" rx="1" fill="#64748B"/>

  <!-- Bottom Left: Reconciled Transactions Ledger Block -->
  <rect x="12" y="35" width="17" height="17" rx="4.5" fill="#334155" fill-opacity="0.75"/>
  <rect x="15.5" y="40" width="10" height="2" rx="1" fill="#94A3B8"/>
  <rect x="15.5" y="44.5" width="6.5" height="2" rx="1" fill="#64748B"/>

  <!-- Bottom Right: AI Core Intelligence Node -->
  <g filter="url(#aiShadow)">
    <rect x="35" y="35" width="17" height="17" rx="4.5" fill="url(#aiGlow)"/>
    <!-- AI Sparkle / Neural Core Symbol -->
    <path d="M43.5 39C43.5 41.5 42 43 39.5 43.5C42 44 43.5 45.5 43.5 48C43.5 45.5 45 44 47.5 43.5C45 43 43.5 41.5 43.5 39Z" fill="#FFFFFF"/>
  </g>

  <!-- Connective Data Bridges (Ledger AI Data Pipeline) -->
  <rect x="29" y="19" width="6" height="2.5" rx="1.25" fill="#475569"/>
  <rect x="19" y="29" width="2.5" height="6" rx="1.25" fill="#475569"/>
  <rect x="29" y="42" width="6" height="2.5" rx="1.25" fill="#38BDF8" fill-opacity="0.7"/>
  <rect x="42" y="29" width="2.5" height="6" rx="1.25" fill="#38BDF8" fill-opacity="0.7"/>
</svg>